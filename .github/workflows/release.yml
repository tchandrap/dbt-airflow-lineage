name: Release

# Push a tag like v0.1.0 to build the extension, attach the .vsix to a GitHub release,
# and (only if the matching secrets exist) publish to the VS Code Marketplace and Open VSX.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx vsce package --skip-license -o "dbt-airflow-lineage-${{ github.ref_name }}.vsix"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dbt-airflow-lineage-${{ github.ref_name }}.vsix" --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --skip-license --packagePath "dbt-airflow-lineage-${{ github.ref_name }}.vsix"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "dbt-airflow-lineage-${{ github.ref_name }}.vsix" -p "$OVSX_PAT"
