name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: npm test
      - run: npm run build
      - run: npx vsce package --allow-missing-repository --skip-license -o dbt-airflow-lineage.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dbt-airflow-lineage.vsix
